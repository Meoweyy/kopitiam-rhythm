name: kopitiam_rhythm
description: >-
  Kopitiam Rhythm — a self-administered tablet rhythm game that trains the
  internal clock in older adults by progressively withdrawing the pacing cue.
  This package is the Flutter shell: UI, platform adapters, persistence and
  export. The measurement core lives in packages/kopitiam_core and is pure Dart.
publish_to: 'none'

# version is reported into every session row as `app_version`, so that the
# analysis can always answer "which build collected this participant's data".
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # The pure measurement core: ports, protocol, session engine, analysis.
  # A path dependency rather than a published package — this is one repository
  # and the two move together.
  kopitiam_core:
    path: ../packages/kopitiam_core

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/audio/
  #   - assets/images/
  #   - assets/sql/
