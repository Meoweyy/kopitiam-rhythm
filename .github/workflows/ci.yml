name: CI

# The toolchain is part of the measurement instrument, not an incidental
# detail: React Native's touch delivery sits in the timing path, so versions are
# pinned in the lockfile and installed with `npm ci` rather than `npm install`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  core:
    name: Measurement core (pure TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Two checks that matter more than they look.
      #
      # `typecheck` is where the architectural guarantee actually lives: the
      # core compiles with "lib": ["ES2022"] and "types": [], so react-native,
      # `process` and `document` do not resolve at all inside src/. A violation
      # is a compile error, not a lint someone can suppress.
      #
      # `test` includes purity.test.ts, which guards the ways that guarantee
      # could be quietly undone later — a new dependency, a new import, or a
      # relaxed compiler option.
      - name: Typecheck core
        run: npm run typecheck --workspace @kopitiam/core

      - name: Test core
        run: npm run test --workspace @kopitiam/core

  app:
    name: React Native app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck app
        run: npm run typecheck --workspace KopitiamRhythm

      - name: Lint app
        run: npm run lint --workspace KopitiamRhythm

      - name: Test app
        run: npm run test --workspace KopitiamRhythm
